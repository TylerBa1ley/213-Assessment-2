<div id="map" style="height: 600px; width: 100%;"></div> 


<script>

    var map = L.map('map').setView([-43.53, 172.63], 13);
    
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);


    const markerLayer = L.layerGroup().addTo(map);
    let allTreeData = null; 


    const treeIcons = {
        "Almond": L.icon({
            iconUrl: 'images/almond-icon.jpg',
            iconSize: [25, 25],      
            iconAnchor: [12, 25],
            popupAnchor: [0, -25]
        }),
        "Apple": L.icon({
            iconUrl: 'images/apple-icon.jpg',
            iconSize: [25, 25],      
            iconAnchor: [12, 25],
            popupAnchor: [0, -25]
        }),
        "Apricot": L.icon({
            iconUrl: 'images/apricot-icon.jpg',
            iconSize: [25, 25],      
            iconAnchor: [12, 25],
            popupAnchor: [0, -25]
        }),			
        "Strawberry Tree": L.icon({
            iconUrl: 'images/strawberry-icon.jpg',
            iconSize: [25, 25],
            iconAnchor: [12, 25],
            popupAnchor: [0, -25]
        })
    };

    fetch('smartview-map-data.geojson')
        .then(response => {
            if (!response.ok) {
                throw new Error("HTTP error " + response.status);
            }
            return response.json();
        })
        .then(data => { 
            allTreeData = data; 
            console.log("Map Ready with SmartView GeoJSON Data!");
        })
        .catch(error => {
            console.error('There was an error loading the tree data file:', error);
        });


    function filterTrees(treeGroupQuery) {
        if (!allTreeData) {
            console.warn("Tree data has not loaded yet. Please wait a moment.");
            return;
        }

        markerLayer.clearLayers(); 

        const matchedTrees = allTreeData.features.filter(f => 
            f.properties.group === treeGroupQuery
        );

        console.log(`Found ${matchedTrees.length} trees for type: ${treeGroupQuery}`);


        matchedTrees.forEach(tree => {
            const name = tree.properties.Name;
            const coords = tree.geometry.coordinates; 
            

            const lng = coords[0]; 
            const lat = coords[1]; 


            const iconToUse = treeIcons[treeGroupQuery] || new L.Icon.Default();


            L.marker([lat, lng], { icon: iconToUse })
                .addTo(markerLayer)
                .bindPopup(`
                    <strong>${name}</strong><br>
                    Botanical: <em>${tree.properties.Botanical || 'N/A'}</em><br>
                    ID: ${tree.properties.id}
                `);
        });
    }


    map.on('click', function(e) {
        L.popup()
            .setLatLng(e.latlng)
            .setContent("You clicked the map at " + e.latlng.toString())
            .openOn(map);
    });
</script>
